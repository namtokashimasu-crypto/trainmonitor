<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東武動物公園駅 発車モニター</title>
  <style>
    :root {
      --bg-color: #0f1115;
      --card-bg: #192734;
      --card-border: #253341;
      --text-main: #ffffff;
      --text-sub: #8899a6;
      --accent-blue: #1da1f2;
      --accent-orange: #ffad1f;
      --time-yellow: #ffcc00;
      --status-green: #00ff66;
      --status-red: #ff3333;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }

    .header {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--text-sub);
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-align: center;
    }

    .container {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      max-width: 650px;
    }

    .card {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .my-title { color: var(--accent-blue); }
    .wife-title { color: var(--accent-orange); }

    .route-info {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-bottom: 16px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--card-border);
    }

    .display-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .train-detail {
      display: flex;
      flex-direction: column;
    }

    .dep-time {
      font-size: 2.8rem;
      font-weight: bold;
      color: var(--time-yellow);
      line-height: 1;
    }

    .train-type {
      font-size: 1rem;
      color: var(--text-main);
      margin-top: 8px;
    }

    .next-train-preview {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-top: 6px;
    }

    .countdown-box {
      text-align: right;
    }

    .countdown-label {
      font-size: 0.8rem;
      color: var(--text-sub);
    }

    .timer {
      font-size: 3.5rem;
      font-weight: bold;
      font-family: "Courier New", Courier, monospace;
      line-height: 1;
      margin-top: 4px;
    }

    .status-ok { color: var(--status-green); }
    .status-warn { color: var(--status-red); }

    .footer-note {
      margin-top: 14px;
      padding-top: 10px;
      border-top: 1px dashed var(--card-border);
      font-size: 0.85rem;
      color: var(--accent-orange);
    }
  </style>
</head>
<body>

    <!-- 1. ご自身用（春日部・北千住・都心方面） -->

      </div>
      <div class="route-info">東武スカイツリーライン / 平日全時間帯対応</div>
      <div class="display-row">
        <div class="train-detail">
          <div class="dep-time" id="my-dep-time">--:--</div>
          <div class="train-type" id="my-train-type">--</div>
          <div class="next-train-preview" id="my-next-preview">次々発: --:--</div>
        </div>
        <div class="countdown-box">
          <div class="countdown-label">発車まで</div>
          <div class="timer status-ok" id="my-timer">--:--</div>
        </div>
      </div>
    </div>

    <!-- 2. 奥様用（久喜行き） -->

        <div class="countdown-box">
          <div class="countdown-label">東武線発車まで</div>

      <div class="footer-note" id="wife-note">
        ※久喜駅での乗り換え待ち時間目安: 約5〜8分
      </div>
    </div>

  </div>

    // ロジック処理
    function updateMonitor() {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const currentSec = now.getSeconds();

      // --- 1. 自分用の更新 ---
      const myIndices = findUpcomingIndices(fullMyTimetable, currentMin, currentSec);
      if (myIndices.length > 0) {
        const first = fullMyTimetable[myIndices[0]];
        document.getElementById("my-dep-time").textContent = first.time;
        document.getElementById("my-train-type").textContent = `${first.type}（${first.dest}行き）`;

        if (myIndices.length > 1) {
          const second = fullMyTimetable[myIndices[1]];
          document.getElementById("my-next-preview").textContent = `次々発: ${second.time} (${second.type})`;
        } else {
          document.getElementById("my-next-preview").textContent = "次々発: なし";
        }

        const [h, m] = first.time.split(":").map(Number);
        const diffSec = ((h * 60 + m) * 60) - (currentMin * 60 + currentSec);
        renderTimer("my-timer", diffSec);
      } else {
        showEndState("my-dep-time", "my-train-type", "my-next-preview", "my-timer");
      }

      // --- 2. 奥様用の更新 ---
      const wifeIndices = findUpcomingIndices(fullWifeTimetable, currentMin, currentSec);
      if (wifeIndices.length > 0) {
        const first = fullWifeTimetable[wifeIndices[0]];
        document.getElementById("wife-dep-time").textContent = first.time;
        document.getElementById("wife-train-type").textContent = `${first.type}（${first.dest}行き）`;

        if (wifeIndices.length > 1) {

          document.getElementById("wife-next-preview").textContent = `次々発: ${second.time} (${second.type})`;
        } else {
          document.getElementById("wife-next-preview").textContent = "次々発: なし";
        }

        const [h, m] = first.time.split(":").map(Number);
        const diffSec = ((h * 60 + m) * 60) - (currentMin * 60 + currentSec);
        renderTimer("wife-timer", diffSec);
      } else {
        showEndState("wife-dep-time", "wife-train-type", "wife-next-preview", "wife-timer");
      }
    }

    // 現在時刻より後の電車のインデックスを検索
    function findUpcomingIndices(list, currentMin, currentSec) {
      const result = [];
      for (let i = 0; i < list.length; i++) {
        const [h, m] = list[i].time.split(":").map(Number);
        // 深夜0時超え対応（0時台は24加算）
        const trainMin = (h < 4 ? h + 24 : h) * 60 + m;
        const nowMinAdjusted = (nowIsMidnight(currentMin) ? currentMin + 1440 : currentMin);

        if (trainMin > nowMinAdjusted || (trainMin === nowMinAdjusted && currentSec === 0)) {
          result.push(i);
          if (result.length >= 2) break;
        }
      }
      return result;
    }

    function nowIsMidnight(currentMin) {
      return currentMin < 240; // 0:00〜3:59
    }

    function renderTimer(elementId, diffSec) {
      const el = document.getElementById(elementId);
      if (diffSec < 0) diffSec = 0;

      const min = Math.floor(diffSec / 60);
      const sec = diffSec % 60;
      
      const mStr = String(min).padStart(2, '0');
      const sStr = String(sec).padStart(2, '0');
      el.textContent = `${mStr}:${sStr}`;

      if (min < 5) {
        el.className = "timer status-warn";
      } else {
        el.className = "timer status-ok";
      }
    }

    function showEndState(timeId, typeId, previewId, timerId) {
      document.getElementById(timeId).textContent = "--:--";
      document.getElementById(typeId).textContent = "本日の運行は終了しました";
      document.getElementById(previewId).textContent = "";
      document.getElementById(timerId).textContent = "00:00";
    }

    setInterval(updateMonitor, 1000);
    updateMonitor();
  </script>

</html>
