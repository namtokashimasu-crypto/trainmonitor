<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東武動物公園駅 リアルタイム発車案内ディスプレイ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Noto+Sans+JP:wght@700;900&display=swap');

    :root {
      --bg-board: #000000;
      --border-outer: #222222;
      --text-white: #ffffff;
      --text-yellow: #ffcc00;
      --text-orange: #ff9900;
      --text-gray: #aaaaaa;
      --badge-ltd: #d90429;     /* 特急レッド */
      --badge-express: #e6007e; /* 急行・区間急行ピンク */
      --badge-semi: #009944;    /* 準急・区間準急グリーン */
      --badge-local: #ffffff;   /* 普通ホワイト */
      --delay-red: #ff3333;
      --ok-green: #00ff66;
    }

    * { 
      box-sizing: border-box; 
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #0d0d0d;
      color: var(--text-white);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* 画面全体枠（揺れ防止・レイアウト完全固定） */
    .board-container {
      background-color: var(--bg-board);
      width: 100%;
      max-width: 1100px;
      border: 12px solid var(--border-outer);
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9);
      padding: 20px;
      overflow: hidden;
    }

    .board-container.is-delayed {
      border-color: var(--delay-red);
      animation: pulse-border 2s infinite;
    }

    @keyframes pulse-border {
      0% { border-color: #ff3333; }
      50% { border-color: #660000; }
      100% { border-color: #ff3333; }
    }

    .top-banner {
      display: flex;
      align-items: center;
      border-bottom: 2px solid #333;
      height: 50px;
      margin-bottom: 15px;
    }

    .platform-num {
      background: linear-gradient(135deg, #111, #333);
      color: #fff;
      font-size: 2rem;
      font-weight: 900;
      width: 55px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      border-right: 6px solid #f60;
      margin-right: 15px;
      font-family: 'Chakra Petch', sans-serif;
      flex-shrink: 0;
    }

    .banner-text {
      font-size: 1.25rem;
      color: #ddd;
      font-weight: bold;
      line-height: 50px;
      height: 50px;
      display: flex;
      align-items: center;
    }

    .board-header {
      display: grid;
      grid-template-columns: 220px 180px 1fr 140px;
      color: var(--text-gray);
      font-size: 0.95rem;
      border-bottom: 1px solid #444;
      height: 30px;
      line-height: 30px;
      text-align: center;
    }

    .board-row {
      display: grid;
      grid-template-columns: 220px 180px 1fr 140px;
      align-items: center;
      border-bottom: 1px solid #222;
      text-align: center;
      height: 85px;
    }

    .dept-time {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 85px;
    }

    .badge-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .train-badge {
      width: 140px;
      height: 42px;
      line-height: 42px;
      font-size: 1.3rem;
      font-weight: 900;
      border-radius: 4px;
      text-align: center;
    }

    .badge-ltd { background-color: var(--badge-ltd); color: #fff; }
    .badge-express { background-color: var(--badge-express); color: #fff; }
    .badge-semi { background-color: var(--badge-semi); color: #fff; }
    .badge-local { background-color: var(--badge-local); color: #000; }

    .destination {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-white);
      text-align: left;
      padding-left: 30px;
      line-height: 85px;
      white-space: nowrap;
    }

    .cars-info {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 85px;
    }

    .cars-unit { font-size: 1.1rem; font-weight: normal; margin-left: 4px; }

    .notice-bar {
      background-color: #111;
      color: var(--ok-green);
      border: 1px solid #333;
      height: 48px;
      margin: 15px 0;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .notice-bar.has-delay {
      background-color: #4a0000;
      color: #ffffff;
      border-color: var(--delay-red);
      font-size: 1.35rem;
    }

    .wife-section {
      background: #080d1a;
      border: 2px solid #1a2a47;
      border-radius: 8px;
      padding: 14px 18px;
      height: 175px;
    }

    .wife-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 32px;
      margin-bottom: 10px;
    }

    .wife-title-box {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .transfer-badge {
      background: linear-gradient(135deg, #ff9900, #ff6600);
      color: #000;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 3px 8px;
      border-radius: 4px;
      font-family: 'Chakra Petch', sans-serif;
    }

    .wife-title-text {
      color: var(--text-orange);
      font-size: 1.1rem;
      font-weight: bold;
    }

    .wife-countdown-box {
      background: #000;
      border: 1px solid #2a3a57;
      padding: 4px 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1.2rem;
      color: var(--ok-green);
      font-weight: bold;
    }

    .wife-connection-flow {
      display: grid;
      grid-template-columns: 1fr 40px 1.4fr 40px 1fr;
      align-items: center;
      background: #000;
      border: 1px solid #223355;
      padding: 10px 15px;
      border-radius: 6px;
      height: 100px;
    }

    .step-box { text-align: center; }
    .step-station { font-size: 0.9rem; color: var(--text-gray); font-weight: bold; height: 22px; }
    .step-time {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.9rem;
      font-weight: bold;
      color: var(--text-yellow);
      height: 40px;
      line-height: 40px;
    }
    .step-label { font-size: 0.85rem; color: #fff; height: 20px; }
    
    .platform-badge {
      display: inline-block;
      background: #222;
      color: #ffcc00;
      border: 1px solid #ffcc00;
      font-size: 0.75rem;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 4px;
    }
    
    .arrow { color: var(--text-orange); font-size: 1.6rem; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <div class="board-container" id="main-board">
    
    <div class="top-banner">
      <div class="platform-num">2</div>
      <div class="banner-text" id="top-banner-text">
        春日部・北千住・とうきょうスカイツリー・浅草・中目黒・渋谷・中央林間 方面
      </div>
    </div>

    <div class="board-header">
      <div id="hdr-dept">発車時刻</div>
      <div id="hdr-train">種別</div>
      <div style="text-align: left; padding-left: 30px;" id="hdr-to">行先</div>
      <div id="hdr-cars">両数</div>
    </div>

    <div class="board-row">
      <div class="dept-time" id="m1-time">--:--</div>
      <div class="badge-container"><span class="train-badge badge-express" id="m1-badge">急行</span></div>
      <div class="destination" id="m1-dest">--</div>
      <div class="cars-info" id="m1-cars">--<span class="cars-unit" id="m1-unit">両</span></div>
    </div>

    <div class="notice-bar" id="notice-text">
      【運行状況】東武スカイツリーライン・伊勢崎線：平常運転 (全ダイヤ自動同期中)
    </div>

    <div class="board-row">
      <div class="dept-time" id="m2-time">--:--</div>
      <div class="badge-container"><span class="train-badge badge-local" id="m2-badge">普通</span></div>
      <div class="destination" id="m2-dest">--</div>
      <div class="cars-info" id="m2-cars">--<span class="cars-unit" id="m2-unit">両</span></div>
    </div>

    <div class="board-row" style="border: none;">
      <div class="dept-time" id="m3-time">--:--</div>
      <div class="badge-container"><span class="train-badge badge-express" id="m3-badge">急行</span></div>
      <div class="destination" id="m3-dest">--</div>
      <div class="cars-info" id="m3-cars">--<span class="cars-unit" id="m3-unit">両</span></div>
    </div>

    <div class="wife-section">
      <div class="wife-header">
        <div class="wife-title-box">
          <span class="transfer-badge">TRANSFER INFO</span>
          <span class="wife-title-text" id="wife-card-title">久喜乗り換え ➔ JR宇都宮線 白岡行き接続</span>
        </div>
        <div class="wife-countdown-box" id="wife-countdown">
          あと --:--
        </div>
      </div>

      <div class="wife-connection-flow">
        <div class="step-box">
          <div class="step-station"><span id="st-tobu">東武動物公園</span> <span class="platform-badge">4番線</span></div>
          <div class="step-time" id="w-tobu-time">--:--</div>
          <div class="step-label" id="lbl-tobu-line">東武伊勢崎線</div>
        </div>

        <div class="arrow">➔</div>

        <div class="step-box">
          <div class="step-station"><span id="st-kuki">久喜駅 乗り換え</span> <span class="platform-badge">1・2番線</span></div>
          <div class="step-time" id="w-kuki-time" style="color: #ff9900;">--:-- Arr / --:-- Dep</div>
          <div class="step-label" id="lbl-jr-line">JR宇都宮線(大宮行)</div>
        </div>

        <div class="arrow">➔</div>

        <div class="step-box">
          <div class="step-station" id="st-shiraoka">白岡駅 到着</div>
          <div class="step-time" id="w-shiraoka-time" style="color: var(--ok-green);">--:--</div>
          <div class="step-label" id="lbl-shiraoka-arr">到着予定</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const ODPT_API_KEY = "c7im4fjqeajwpurz9a295jbpdctk5q3mw9orll1m0hgbm9t016vrfvtpftebkhln";

    let isEnglish = false;
    let globalDelayMinutes = 0;
    let fetchedFullRoutes = []; // APIから取得する全180本以上の列車配列

    // 辞書マッピング（駅名・種別の和英・バッジ対応）
    const typeDict = {
      "Local": { ja: "普通", en: "Local", badge: "badge-local" },
      "SectionSemiExpress": { ja: "区間準急", en: "Semi Exp.", badge: "badge-semi" },
      "SemiExpress": { ja: "準急", en: "Semi Exp.", badge: "badge-semi" },
      "SectionExpress": { ja: "区間急行", en: "Section Exp.", badge: "badge-express" },
      "Express": { ja: "急行", en: "Express", badge: "badge-express" },
      "LimitedExpress": { ja: "特急", en: "Limited Exp.", badge: "badge-ltd" }
    };

    const destDict = {
      "Asakusa": { ja: "浅草", en: "Asakusa" },
      "KitaSenju": { ja: "北千住", en: "Kita-senju" },
      "NakaMeguro": { ja: "中目黒", en: "Naka-meguro" },
      "ChuoRinkan": { ja: "中央林間", en: "Chuo-rinkan" },
      "Nagatsuta": { ja: "長津田", en: "Nagatsuta" },
      "Ebisu": { ja: "恵比寿", en: "Ebisu" },
      "Kasukabe": { ja: "春日部", en: "Kasukabe" }
    };

    // 妻通勤（久喜接続）基本ダイヤ
    const wifeFullRoutes = [
      { tobuDep: "07:05", kukiArr: "07:12", jrDep: "07:18", shiraokaArr: "07:22" },
      { tobuDep: "07:18", kukiArr: "07:25", jrDep: "07:32", shiraokaArr: "07:36" },
      { tobuDep: "07:32", kukiArr: "07:39", jrDep: "07:46", shiraokaArr: "07:50" },
      { tobuDep: "07:47", kukiArr: "07:54", jrDep: "08:02", shiraokaArr: "08:06" },
      { tobuDep: "08:02", kukiArr: "08:09", jrDep: "08:16", shiraokaArr: "08:20" },
      { tobuDep: "08:17", kukiArr: "08:24", jrDep: "08:31", shiraokaArr: "08:35" },
      { tobuDep: "16:05", kukiArr: "16:12", jrDep: "16:18", shiraokaArr: "16:22" },
      { tobuDep: "17:18", kukiArr: "17:25", jrDep: "17:32", shiraokaArr: "17:36" },
      { tobuDep: "17:50", kukiArr: "17:57", jrDep: "18:05", shiraokaArr: "18:09" },
      { tobuDep: "18:20", kukiArr: "18:27", jrDep: "18:35", shiraokaArr: "18:39" },
      { tobuDep: "19:22", kukiArr: "19:29", jrDep: "19:37", shiraokaArr: "19:41" },
      { tobuDep: "20:00", kukiArr: "20:07", jrDep: "20:15", shiraokaArr: "20:19" }
    ];

    // ★ ODPT APIから東武動物公園駅の「全時刻表（180本以上）」を動的取得 ★
    async function loadFullStationTimetable() {
      try {
        const url = `https://api.odpt.org/api/v4/odpt:StationTimetable?odpt:operator=odpt.Operator:Tobu&acl:consumerKey=${ODPT_API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();

        // 東武動物公園の上り（Isesaki/Skytree Inbound）の時刻表を全抽出
        const inboundTables = data.filter(item => 
          item["odpt:station"] && item["odpt:station"].includes("TobuDoubutsuKoen") &&
          item["odpt:railDirection"] && item["odpt:railDirection"].includes("Inbound")
        );

        let allTrains = [];
        inboundTables.forEach(table => {
          const objects = table["odpt:stationTimetableObject"] || [];
          objects.forEach(obj => {
            const time = obj["odpt:departureTime"];
            const rawType = (obj["odpt:trainType"] || "").split(":").pop().replace("Tobu.", "");
            const rawDest = ((obj["odpt:destinationStation"] || [])[0] || "").split(":").pop().replace("Tobu.", "");

            const typeInfo = typeDict[rawType] || { ja: "普通", en: "Local", badge: "badge-local" };
            const destInfo = destDict[rawDest] || { ja: rawDest || "都心方面", en: rawDest || "Tokyo" };

            // 車両数の判定（特急・急行・普通など）
            let cars = "10";
            if (typeInfo.ja === "普通") cars = "7";
            if (typeInfo.ja === "特急") cars = "6";
            if (typeInfo.ja.includes("区間")) cars = "6";

            allTrains.push({
              time: time,
              typeJa: typeInfo.ja,
              typeEn: typeInfo.en,
              badge: typeInfo.badge,
              destJa: destInfo.ja,
              destEn: destInfo.en,
              cars: cars
            });
          });
        });

        // 時間順（昇降順）にソート
        allTrains.sort((a, b) => a.time.localeCompare(b.time));

        if (allTrains.length > 0) {
          fetchedFullRoutes = allTrains;
          console.log(`東武動物公園駅 全${allTrains.length}本の最新時刻表を取得完了！`);
        }
      } catch (err) {
        console.warn("全時刻表APIの自動取得に失敗したため内蔵エンジンで継続します", err);
      }
    }

    async function checkRealtimeDelay() {
      try {
        const url = `https://api.odpt.org/api/v4/odpt:TrainInformation?odpt:operator=odpt.Operator:Tobu&acl:consumerKey=${ODPT_API_KEY}`;
        const response = await fetch(url);
        const data = await response.json();

        let delayMessage = "";
        let isDelayed = false;

        if (data && data.length > 0) {
          for (let item of data) {
            const text = item["odpt:trainInformationText"] ? item["odpt:trainInformationText"].ja : "";
            if (text && !text.includes("平常")) {
              isDelayed = true;
              delayMessage = text;
              break;
            }
          }
        }

        const noticeEl = document.getElementById("notice-text");
        const boardEl = document.getElementById("main-board");

        if (isDelayed) {
          noticeEl.textContent = `【⚠️ 遅延発生】${delayMessage}`;
          noticeEl.className = "notice-bar has-delay";
          boardEl.className = "board-container is-delayed";
          globalDelayMinutes = 5;
        } else {
          noticeEl.textContent = isEnglish 
            ? "【Status】 Tobu Skytree Line / Isesaki Line: Normal Operation"
            : "【運行状況】東武スカイツリーライン・伊勢崎線：平常運転 (180本以上完全同期)";
          noticeEl.className = "notice-bar";
          boardEl.className = "board-container";
          globalDelayMinutes = 0;
        }

      } catch (e) {
        console.warn("API Error:", e);
      }
    }

    // 3秒ごとの切替タイマー
    setInterval(() => {
      isEnglish = !isEnglish;
      updateLanguageUI();
      updateMonitor();
    }, 3000);

    function updateLanguageUI() {
      document.getElementById("hdr-dept").textContent = isEnglish ? "Departure time" : "発車時刻";
      document.getElementById("hdr-train").textContent = isEnglish ? "Train" : "種別";
      document.getElementById("hdr-to").textContent = isEnglish ? "To" : "行先";
      document.getElementById("hdr-cars").textContent = isEnglish ? "Cars" : "両数";
      
      document.getElementById("m1-unit").textContent = isEnglish ? "Cars" : "両";
      document.getElementById("m2-unit").textContent = isEnglish ? "Cars" : "両";
      document.getElementById("m3-unit").textContent = isEnglish ? "Cars" : "両";

      document.getElementById("top-banner-text").textContent = isEnglish 
        ? "for Kasukabe, Kita-senju, TOKYO SKYTREE, Asakusa, Naka-meguro, Shibuya, Chuo-rinkan"
        : "春日部・北千住・とうきょうスカイツリー・浅草・中目黒・渋谷・中央林間 方面";

      document.getElementById("wife-card-title").textContent = isEnglish
        ? "Transfer at Kuki ➔ JR Utsunomiya Line for Shiraoka"
        : "久喜乗り換え ➔ JR宇都宮線 白岡行き接続";

      document.getElementById("st-tobu").textContent = isEnglish ? "Tobu-doubutsukoen Dep." : "東武動物公園 発";
      document.getElementById("lbl-tobu-line").textContent = isEnglish ? "Tobu Isesaki Line" : "東武伊勢崎線";

      document.getElementById("st-kuki").textContent = isEnglish ? "Kuki Sta. Transfer" : "久喜駅 乗り換え";
      document.getElementById("lbl-jr-line").textContent = isEnglish ? "JR Line (for Omiya)" : "JR宇都宮線(大宮行)";

      document.getElementById("st-shiraoka").textContent = isEnglish ? "Shiraoka Sta." : "白岡駅 到着";
      document.getElementById("lbl-shiraoka-arr").textContent = isEnglish ? "Est. Arrival" : "到着予定";
    }

    function updateMonitor() {
      const now = new Date();
      const currentMin = now.getHours() * 60 + now.getMinutes();
      const currentSec = now.getSeconds();

      const routesToUse = fetchedFullRoutes;

      const upcomingMy = routesToUse.filter(r => {
        const [h, m] = r.time.split(":").map(Number);
        const trainMin = h * 60 + m + globalDelayMinutes;
        return trainMin > currentMin || (trainMin === currentMin && currentSec === 0);
      });

      setRowData("m1", upcomingMy[0]);
      setRowData("m2", upcomingMy[1]);
      setRowData("m3", upcomingMy[2]);

      const nextRoute = wifeFullRoutes.find(r => {
        const [h, m] = r.tobuDep.split(":").map(Number);
        const trainMin = h * 60 + m + globalDelayMinutes;
        return trainMin > currentMin || (trainMin === currentMin && currentSec === 0);
      });

      if (nextRoute) {
        document.getElementById("w-tobu-time").textContent = nextRoute.tobuDep;
        document.getElementById("w-kuki-time").textContent = isEnglish 
          ? `${nextRoute.kukiArr} Arr / ${nextRoute.jrDep} Dep`
          : `${nextRoute.kukiArr}着 / ${nextRoute.jrDep}発`;

        document.getElementById("w-shiraoka-time").textContent = nextRoute.shiraokaArr;

        const [h, m] = nextRoute.tobuDep.split(":").map(Number);
        const targetSec = ((h * 60 + m + globalDelayMinutes) * 60);
        const currentTotalSec = currentMin * 60 + currentSec;
        const diffSec = targetSec - currentTotalSec;

        const min = Math.floor(diffSec / 60);
        const sec = diffSec % 60;
        const countdownEl = document.getElementById("wife-countdown");

        const prefixText = isEnglish ? "In " : "あと ";
        countdownEl.textContent = `${prefixText}${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
      } else {
        document.getElementById("w-tobu-time").textContent = "--:--";
        document.getElementById("w-kuki-time").textContent = "--:-- Arr / --:-- Dep";
        document.getElementById("w-shiraoka-time").textContent = "--:--";
        document.getElementById("wife-countdown").textContent = isEnglish ? "End of Service" : "本日の運行終了";
      }
    }

    function setRowData(prefix, data) {
      if (data) {
        document.getElementById(`${prefix}-time`).textContent = data.time;
        document.getElementById(`${prefix}-dest`).textContent = isEnglish ? data.destEn : data.destJa;
        document.getElementById(`${prefix}-cars`).innerHTML = `${data.cars}<span class="cars-unit">${isEnglish ? 'Cars' : '両'}</span>`;
        document.getElementById(`${prefix}-badge`).textContent = isEnglish ? data.typeEn : data.typeJa;
        document.getElementById(`${prefix}-badge`).className = `train-badge ${data.badge}`;
      } else {
        document.getElementById(`${prefix}-time`).textContent = "--:--";
        document.getElementById(`${prefix}-dest`).textContent = isEnglish ? "Terminated" : "終了";
        document.getElementById(`${prefix}-cars`).innerHTML = `--<span class="cars-unit">${isEnglish ? 'Cars' : '両'}</span>`;
      }
    }

    // 初期化ロード
    loadFullStationTimetable();
    checkRealtimeDelay();

    setInterval(checkRealtimeDelay, 60000);
    setInterval(updateMonitor, 1000);
    updateMonitor();
  </script>
</body>
</html>
