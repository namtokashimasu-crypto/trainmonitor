<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>東武動物公園駅 久喜方面発車案内ディスプレイ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Noto+Sans+JP:wght@700;900&display=swap');

    :root {
      --bg-board: #000000;
      --border-outer: #222222;
      --text-white: #ffffff;
      --text-yellow: #ffcc00;
      --text-orange: #ff9900;
      --text-gray: #aaaaaa;
      --badge-ltd: #d90429;
      --badge-express: #e6007e;
      --badge-semi: #009944;
      --badge-local: #ffffff;
      --badge-end: #333333;
      --delay-red: #ff3333;
      --ok-green: #00ff66;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0d0d0d;
      color: var(--text-white);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
    }

    .board-wrapper {
      width: 100%;
      max-width: 1100px;
      display: flex;
      justify-content: center;
    }

    .board-container {
      background-color: var(--bg-board);
      width: 1100px;
      border: 12px solid var(--border-outer);
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9);
      padding: 20px;
      position: relative;
      transform-origin: top center;
    }

    .board-container.is-delayed {
      border-color: var(--delay-red);
      animation: pulse-border 2s infinite;
    }

    @keyframes pulse-border {
      0% { border-color: #ff3333; }
      50% { border-color: #660000; }
      100% { border-color: #ff3333; }
    }

    .top-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #333;
      height: 50px;
      margin-bottom: 12px;
    }

    .banner-left { display: flex; align-items: center; width: 610px; min-width: 610px; }
    .banner-right { display: flex; align-items: center; justify-content: flex-end; gap: 15px; width: 390px; min-width: 390px; }

    .platform-num {
      background: linear-gradient(135deg, #111, #333);
      color: #fff;
      font-size: 1.35rem;
      font-weight: 900;
      width: 72px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      border-right: 6px solid #f60;
      margin-right: 15px;
      font-family: 'Chakra Petch', sans-serif;
      flex-shrink: 0;
    }

    .banner-text {
      font-size: 1.25rem;
      color: #ddd;
      font-weight: bold;
      line-height: 50px;
      height: 50px;
      display: flex;
      align-items: center;
      width: 520px;
      min-width: 520px;
    }

    .clock-box {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-yellow);
      background: #111;
      border: 1px solid #333;
      padding: 2px 14px;
      border-radius: 4px;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
    }

    .clock-colon {
      display: inline-block;
      width: 0.4em;
      text-align: center;
      transition: opacity 0.1s;
    }

    .clock-colon.blink-off { opacity: 0; }

    .audio-btn {
      background: #222;
      color: #ffcc00;
      border: 1px solid #ffcc00;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .audio-btn.enabled {
      background: #00ff66;
      color: #000;
      border-color: #00ff66;
    }

    .board-header {
      display: grid;
      grid-template-columns: 220px 190px 1fr 140px;
      color: var(--text-gray);
      font-size: 0.95rem;
      border-bottom: 1px solid #444;
      height: 28px;
      line-height: 28px;
      text-align: center;
    }

    .board-row {
      display: grid;
      grid-template-columns: 220px 190px 1fr 140px;
      align-items: center;
      border-bottom: 1px solid #222;
      text-align: center;
      height: 75px;
    }

    .dept-time {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 3.2rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 75px;
    }

    .badge-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .train-badge {
      width: 165px;
      height: 38px;
      line-height: 38px;
      font-size: 1.1rem;
      font-weight: 900;
      border-radius: 4px;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      padding: 0 4px;
    }

    .badge-ltd { background-color: var(--badge-ltd); color: #fff; }
    .badge-express { background-color: var(--badge-express); color: #fff; }
    .badge-semi { background-color: var(--badge-semi); color: #fff; }
    .badge-local { background-color: var(--badge-local); color: #000; }
    .badge-end { background-color: var(--badge-end); color: #aaa; }

    .destination {
      font-size: 2rem;
      font-weight: 900;
      color: var(--text-white);
      text-align: left;
      padding: 0 20px 0 30px;
      line-height: 75px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
    }

    .dest-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .first-train-badge {
      background: #ff9900;
      color: #000;
      font-size: 0.75rem;
      font-weight: 900;
      width: 58px;
      height: 24px;
      line-height: 24px;
      border-radius: 3px;
      text-align: center;
      display: inline-block;
      letter-spacing: 0.5px;
      font-family: 'Chakra Petch', 'Noto Sans JP', sans-serif;
      flex-shrink: 0;
      margin-left: 15px;
    }

    .cars-info {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 75px;
    }

    .cars-unit { font-size: 1rem; font-weight: normal; margin-left: 4px; }

    .notice-bar {
      background-color: #111;
      color: var(--ok-green);
      border: 1px solid #333;
      height: 42px;
      margin: 10px 0;
      font-size: 1.15rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 15px;
      overflow: hidden;
      position: relative;
      white-space: nowrap;
    }

    .notice-bar.has-delay {
      background-color: #4a0000;
      color: #ffffff;
      border-color: var(--delay-red);
      font-size: 1.2rem;
    }

    .notice-text-content {
      display: inline-block;
      white-space: nowrap;
    }

    .notice-text-content.scroll {
      padding-left: 100%;
      animation: marquee 18s linear infinite;
    }

    @keyframes marquee {
      0% { transform: translateX(0); }
      100% { transform: translateX(-100%); }
    }

    .info-section {
      background: #060b18;
      border: 2px solid #1c2d4a;
      border-radius: 8px;
      padding: 12px 18px;
      height: 155px;
    }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 28px;
      margin-bottom: 8px;
    }

    .info-title-box { display: flex; align-items: center; gap: 12px; width: 760px; min-width: 760px; }

    .route-badge {
      background: linear-gradient(135deg, #ff9900, #ff6600);
      color: #000;
      font-size: 0.8rem;
      font-weight: 900;
      padding: 3px 10px;
      border-radius: 4px;
      font-family: 'Chakra Petch', sans-serif;
      width: 92px;
      min-width: 92px;
      text-align: center;
    }

    .info-title-text {
      color: var(--text-orange);
      font-size: 1.15rem;
      font-weight: 900;
      width: 650px;
      min-width: 650px;
      white-space: nowrap;
    }

    .info-countdown-box {
      background: #000;
      border: 1px solid #2a3a57;
      padding: 2px 12px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1.15rem;
      color: var(--ok-green);
      font-weight: bold;
      width: 125px;
      min-width: 125px;
      text-align: center;
    }

    .info-connection-flow {
      display: grid;
      grid-template-columns: 1fr 28px 1.5fr 28px 1fr;
      align-items: center;
      gap: 6px;
      height: 95px;
    }

    .step-card {
      background: #111625;
      border: 1px solid #233555;
      border-radius: 6px;
      padding: 8px 6px;
      height: 95px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .step-card.highlight { background: #0f1c33; border-color: #38bdf8; }

    .step-station-row { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
    .step-station-name {
      font-size: 0.95rem;
      color: #e2e8f0;
      font-weight: 900;
      display: inline-block;
      min-width: 132px;
      white-space: nowrap;
      text-align: center;
    }

    .platform-badge {
      background: #ffcc00;
      color: #000;
      font-size: 0.7rem;
      font-weight: 900;
      padding: 1px 5px;
      border-radius: 3px;
      width: 62px;
      min-width: 62px;
      text-align: center;
    }

    .step-time-main {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-yellow);
      line-height: 1;
    }

    .step-time-transfer {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-orange);
      line-height: 1;
      white-space: nowrap;
    }

    .step-sub-label {
      font-size: 0.75rem;
      color: #94a3b8;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .arrow { color: var(--text-orange); font-size: 1.2rem; font-weight: bold; text-align: center; }

    .train-badge.long-label { font-size: 0.78rem; letter-spacing: -0.5px; }
    .stop-guide { display: flex; flex-direction: column; }
    .stop-service-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      height: 27px;
      white-space: nowrap;
    }
    .stop-service-name { color: var(--text-yellow); font-size: 1.1rem; font-weight: 900; }
    .stop-destination { color: #fff; font-size: 1rem; font-weight: 900; }
    .info-section.stop-guide { height: 190px; padding-bottom: 8px; }
    .stop-list {
      position: relative;
      height: 98px;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      padding: 12px 2px 0;
      color: #fff;
      font-weight: 900;
      text-align: center;
      overflow: hidden;
    }
    .stop-list::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 18px;
      right: 18px;
      height: 7px;
      border-radius: 3px;
      background: linear-gradient(180deg, #f5ae34 0%, #d16b00 100%);
      box-shadow: 0 0 7px rgba(255, 153, 0, 0.8);
    }
    .stop-point {
      position: relative;
      z-index: 1;
      flex: 1 1 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 8px;
    }
    .stop-node {
      width: 11px;
      height: 11px;
      margin-top: -13px;
      margin-bottom: 5px;
      border: 2px solid #a8b7ff;
      border-radius: 50%;
      background: #f5f7ff;
      box-shadow: 0 0 6px #778cff;
      flex-shrink: 0;
    }
    .stop-label {
      writing-mode: vertical-rl;
      text-orientation: upright;
      display: inline-flex;
      align-items: center;
      min-height: 52px;
      max-height: 67px;
      padding: 4px 3px;
      border: 2px solid #b7c2ff;
      border-radius: 4px;
      background: #f2f4ff;
      color: #12183a;
      font-size: 0.82rem;
      line-height: 1;
      letter-spacing: 1px;
      box-shadow: 0 0 5px rgba(151, 164, 255, 0.7);
      overflow: hidden;
    }
    .stop-point.origin .stop-label {
      border-color: #ff9d00;
      background: #ffb52e;
      color: #111;
    }
    .stop-point.origin .stop-node {
      border-color: #ff3b30;
      background: #ff3b30;
      box-shadow: 0 0 6px #ff3b30;
    }
    .stop-point.destination .stop-label {
      border-color: #d7ddff;
      background: #fff;
      color: #090d2c;
      font-weight: 900;
    }
    .stop-point.destination .stop-node {
      border-color: #fff;
      background: #fff;
      box-shadow: 0 0 7px #fff;
    }
    .stop-list.compact .stop-label {
      min-height: 46px;
      max-height: 62px;
      padding: 3px 2px;
      font-size: 0.69rem;
      letter-spacing: 0;
    }
    .stop-list.english .stop-point { padding: 8px 2px 0; }
    .stop-list.english .stop-label {
      writing-mode: horizontal-tb;
      text-orientation: mixed;
      display: flex;
      min-height: 30px;
      max-height: 42px;
      width: 100%;
      padding: 3px 2px;
      font-size: 0.58rem;
      line-height: 1.05;
      letter-spacing: 0;
      white-space: normal;
    }
    .bottom-notice { margin-top: 10px; margin-bottom: 0; }
  </style>
</head>
<body>

  <div class="board-wrapper">
    <div class="board-container" id="main-board">
      
      <!-- 1. 東武動物公園駅 上りホーム案内 ＆ 時計 -->
      <div class="top-banner">
        <div class="banner-left">
          <div class="platform-num">4</div>
          <div class="banner-text" id="top-banner-text">久喜・館林・伊勢崎 方面</div>
        </div>
        <div class="banner-right">
          <button class="audio-btn" id="audio-toggle-btn" onclick="toggleAudio()">🔊 音声: OFF (クリックで有効化)</button>
          <div class="clock-box">
            <span id="clock-hour">00</span>
            <span class="clock-colon" id="clock-colon">:</span>
            <span id="clock-min">00</span>
          </div>
        </div>
      </div>

      <!-- 2. 発車標テーブルヘッダー -->
      <div class="board-header">
        <div id="hdr-dept">発車時刻</div>
        <div id="hdr-train">種別</div>
        <div style="text-align: left; padding-left: 30px;" id="hdr-to">行先</div>
        <div id="hdr-cars">両数</div>
      </div>

      <!-- 先発 -->
      <div class="board-row">
        <div class="dept-time" id="m1-time">--:--</div>
        <div class="badge-container"><span class="train-badge badge-local" id="m1-badge">普通</span></div>
        <div class="destination" id="m1-dest">--</div>
        <div class="cars-info" id="m1-cars">--<span class="cars-unit" id="m1-unit">両</span></div>
      </div>

      <!-- 次列車の停車駅案内 -->
      <div class="info-section stop-guide">
        <div class="info-header">
          <div class="info-title-box">
            <span class="route-badge" id="route-badge-label">停車駅</span>
            <span class="info-title-text" id="info-card-title">次の列車の停車駅</span>
          </div>
          <div class="info-countdown-box" id="info-countdown">あと 00:00</div>
        </div>
        <div class="stop-service-row">
          <span class="stop-service-name" id="stop-service-name">--</span>
          <span class="stop-destination" id="stop-destination">--</span>
        </div>
        <div class="stop-list" id="stop-list">
          <span class="stop-point origin">
            <span class="stop-node"></span>
            <span class="stop-label">東武動物公園</span>
          </span>
          <span class="stop-point destination">
            <span class="stop-node"></span>
            <span class="stop-label">--</span>
          </span>
        </div>
      </div>

      <!-- 次発 -->
      <div class="board-row">
        <div class="dept-time" id="m2-time">--:--</div>
        <div class="badge-container"><span class="train-badge badge-local" id="m2-badge">普通</span></div>
        <div class="destination" id="m2-dest">--</div>
        <div class="cars-info" id="m2-cars">--<span class="cars-unit" id="m2-unit">両</span></div>
      </div>

      <!-- 次々発 -->
      <div class="board-row" style="border: none;">
        <div class="dept-time" id="m3-time">--:--</div>
        <div class="badge-container"><span class="train-badge badge-local" id="m3-badge">普通</span></div>
        <div class="destination" id="m3-dest">--</div>
        <div class="cars-info" id="m3-cars">--<span class="cars-unit" id="m3-unit">両</span></div>
      </div>

      <!-- 運行状況テロップ -->
      <div class="notice-bar bottom-notice" id="notice-text">
        <span class="notice-text-content" id="notice-content">【運行状況】東武線：平常運転</span>
      </div>

    </div>
  </div>

  <script>
    const ODPT_API_KEY = "c7im4fjqeajwpurz9a295jbpdctk5q3mw9orll1m0hgbm9t016vrfvtpftebkhln";

    let isEnglish = false;
    let audioEnabled = false;
    let audioCtx = null;
    let lastChimeTime = "";
    let realtimeDelayMessage = ""; 
    let isDelayedStatus = false;

    function adjustScale() {
      const container = document.getElementById("main-board");
      const wrapperWidth = window.innerWidth - 20;
      const baseWidth = 1124; 
      if (wrapperWidth < baseWidth) {
        const scale = wrapperWidth / baseWidth;
        container.style.transform = `scale(${scale})`;
        document.body.style.height = `${container.offsetHeight * scale}px`;
      } else {
        container.style.transform = "none";
        document.body.style.height = "100vh";
      }
    }

    window.addEventListener('resize', adjustScale);
    window.addEventListener('load', adjustScale);

    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const sec = now.getSeconds();

      document.getElementById("clock-hour").textContent = h;
      document.getElementById("clock-min").textContent = m;

      const colonEl = document.getElementById("clock-colon");
      if (sec % 2 === 1) {
        colonEl.classList.add("blink-off");
      } else {
        colonEl.classList.remove("blink-off");
      }
    }

    async function checkRealtimeInfo() {
      try {
        const tobuUrl = `https://api.odpt.org/api/v4/odpt:TrainInformation?odpt:operator=odpt.Operator:Tobu&acl:consumerKey=${ODPT_API_KEY}`;
        const tobuRes = await fetch(tobuUrl).catch(() => null);

        let delayMsgs = [];

        if (tobuRes && tobuRes.ok) {
          const tobuData = await tobuRes.json();
          for (let item of tobuData) {
            const rawText = item["odpt:trainInformationText"] ? item["odpt:trainInformationText"].ja : "";
            if (rawText && !rawText.includes("平常")) {
              delayMsgs.push(`【東武】${rawText}`);
              break;
            }
          }
        }

        if (delayMsgs.length > 0) {
          isDelayedStatus = true;
          realtimeDelayMessage = delayMsgs.join(" ／ ");
        } else {
          isDelayedStatus = false;
          realtimeDelayMessage = "";
        }
      } catch (e) {
        console.warn("ODPT API Error:", e);
      }
    }

    function updateNoticeDisplay(text, isDelay) {
      const noticeBar = document.getElementById("notice-text");
      const noticeContent = document.getElementById("notice-content");
      
      noticeContent.textContent = text;

      if (isDelay) {
        noticeBar.className = "notice-bar has-delay";
      } else {
        noticeBar.className = "notice-bar";
      }

      if (noticeContent.offsetWidth > noticeBar.clientWidth - 30) {
        noticeContent.classList.add("scroll");
      } else {
        noticeContent.classList.remove("scroll");
      }
    }

    function playChime() {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.8);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(523.25, now + 0.35);
        gain2.gain.setValueAtTime(0.3, now + 0.35);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.35);
        osc2.stop(now + 1.2);
      } catch (e) { console.warn("Audio error:", e); }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById("audio-toggle-btn");
      if (audioEnabled) {
        btn.classList.add("enabled");
        playChime();
      } else {
        btn.classList.remove("enabled");
      }
      updateHeaderTexts();
    }

    document.body.addEventListener('click', () => {
      if (!audioEnabled) toggleAudio();
    }, { once: true });

    setInterval(() => {
      isEnglish = !isEnglish;
      updateHeaderTexts();
      updateMonitor();
    }, 3000);

    // ★ 日本の祝日・振替休日を自動判定する関数 ★
    function isJapaneseHoliday(date) {
      const year = date.getFullYear();
      const m = date.getMonth() + 1;
      const d = date.getDate();
      const dayOfWeek = date.getDay(); // 0:Sun, 6:Sat

      // 固定祝日
      if (m === 1 && d === 1) return true;  // 元日
      if (m === 2 && d === 11) return true; // 建国記念の日
      if (m === 2 && d === 23) return true; // 天皇誕生日
      if (m === 4 && d === 29) return true; // 昭和の日
      if (m === 5 && d === 3) return true;  // 憲法記念日
      if (m === 5 && d === 4) return true;  // みどりの日
      if (m === 5 && d === 5) return true;  // こどもの日
      if (m === 8 && d === 11) return true; // 山の日
      if (m === 11 && d === 3) return true; // 文化の日
      if (m === 11 && d === 23) return true;// 勤労感謝の日

      // 春分の日・秋分の日（簡易計算）
      const vernalEquinox = Math.floor(20.8431 + 0.242194 * (year - 2000)) - Math.floor((year - 2000) / 4);
      if (m === 3 && d === vernalEquinox) return true;
      const autumnalEquinox = Math.floor(23.2488 + 0.242194 * (year - 2000)) - Math.floor((year - 2000) / 4);
      if (m === 9 && d === autumnalEquinox) return true;

      // ハッピーマンデー（第X月曜日）
      // 成人の日: 1月第2月曜, 海の日: 7月第3月曜, 敬老の日: 9月第3月曜, スポーツの日: 10月第2月曜
      const nthDayOfWeek = Math.floor((d - 1) / 7) + 1;
      if (dayOfWeek === 1) {
        if (m === 1 && nthDayOfWeek === 2) return true;
        if (m === 7 && nthDayOfWeek === 3) return true;
        if (m === 9 && nthDayOfWeek === 3) return true;
        if (m === 10 && nthDayOfWeek === 2) return true;
      }

      return false;
    }

    // ★ 平日か休日かを完全に判定（土日・祝日なら true = 土休日ダイヤ） ★
    function isWeekendOrHoliday(date) {
      const day = date.getDay();
      if (day === 0 || day === 6) return true;
      if (isJapaneseHoliday(date)) return true;

      // 「国民の休日」：前日と翌日が祝日の平日
      const prev = new Date(date); prev.setDate(prev.getDate() - 1);
      const next = new Date(date); next.setDate(next.getDate() + 1);
      if (isJapaneseHoliday(prev) && isJapaneseHoliday(next)) return true;

      // 振替休日：直前まで連続する祝日の中に日曜日があれば休日
      const cursor = new Date(date);
      for (let i = 0; i < 7; i++) {
        cursor.setDate(cursor.getDate() - 1);
        if (!isJapaneseHoliday(cursor)) break;
        if (cursor.getDay() === 0) return true;
      }
      return false;
    }

      const isHoliday = isWeekendOrHoliday(now);

        connections: isHoliday ? holidayConnections : weekdayConnections
      };
    }

    function timeToMinutes(timeStr) {
      if (!timeStr || timeStr === "---") return 9999;
      const [h, m] = timeStr.split(":").map(Number);
      let mins = h * 60 + m;
      if (h < 4) mins += 1440;
      return mins;
    }

    function updateMonitor() {
      adjustScale();
      updateClock();

      const now = new Date();
      let nowH = now.getHours();
      let nowM = now.getMinutes();
      let currentMin = nowH * 60 + nowM;
      if (nowH < 4) currentMin += 1440;
      const currentSec = now.getSeconds();

      const { upTrains, connections } = getTodayDatasets();

      const lastTrainMin = Math.max(...upTrains.map(r => timeToMinutes(r.time)));
      const switchMin = lastTrainMin + 10;

      let upcomingUp = [];
      let isNextDayTrain = false;

      if (currentMin > switchMin) {
        upcomingUp = upTrains.slice(0, 3);
        isNextDayTrain = true;
      } else {
        upcomingUp = upTrains.filter(r => {
          const trainMin = timeToMinutes(r.time);
          return trainMin > currentMin || (trainMin === currentMin && currentSec === 0);
        });
      }

      const boardContainer = document.getElementById("main-board");

      if (isDelayedStatus) {
        updateNoticeDisplay(`【⚠️遅延発生】${realtimeDelayMessage}`, true);
        boardContainer.classList.add("is-delayed");
      } else {
        boardContainer.classList.remove("is-delayed");

        if (upcomingUp.length === 0) {
          const endText = isEnglish ? "【Notice】 End of today's train service." : "【案内】本日の電車は終了いたしました。";
          updateNoticeDisplay(endText, false);
        } else {
          const okText = isEnglish ? "【Status】 Tobu Line: Normal Operation" : "【運行状況】東武線：平常運転";
          updateNoticeDisplay(okText, false);
        }
      }

      if (upcomingUp.length === 0) {
        setRowDataFinished("m1", isEnglish); 
        setRowDataFinished("m2", isEnglish); 
        setRowDataFinished("m3", isEnglish);
      } else {
        setRowData("m1", upcomingUp[0], isEnglish);
        setRowData("m2", upcomingUp[1], isEnglish);
        setRowData("m3", upcomingUp[2], isEnglish);

        const nextTrain = upcomingUp[0];
        let trainMin = timeToMinutes(nextTrain.time);
        if (isNextDayTrain && trainMin < currentMin) trainMin += 1440;
        const diffSec = (trainMin * 60) - (currentMin * 60 + currentSec);

        if (diffSec === 10 && lastChimeTime !== nextTrain.time) {
          playChime();
          lastChimeTime = nextTrain.time;
        }
      }

      if (upcomingUp.length > 0) {
        const nextTrain = upcomingUp[0];
        let trainMin = timeToMinutes(nextTrain.time);
        if (isNextDayTrain && trainMin < currentMin) trainMin += 1440;
        const seconds = Math.max(0, trainMin * 60 - (currentMin * 60 + currentSec));
        updateStopGuide(nextTrain, seconds);
      } else {
        updateStopGuide(null, 0);
      }
    }

    function updateStopGuide(train, seconds) {
      const countdown = document.getElementById("info-countdown");
      const service = document.getElementById("stop-service-name");
      const destination = document.getElementById("stop-destination");
      const list = document.getElementById("stop-list");
      if (!train) {
        countdown.textContent = "本日終了";
        service.textContent = "--";
        destination.textContent = "--";
        list.textContent = "本日の運転は終了しました";
        list.classList.remove("compact");
        list.classList.remove("english");
        return;
      }
      const min = Math.floor(seconds / 60);
      const sec = seconds % 60;
      countdown.textContent = `あと ${String(min).padStart(2, "0")}:${String(sec).padStart(2, "0")}`;
      service.textContent = train.serviceNameJa || train.typeJa;
      destination.textContent = `${train.destJa}行`;
      const stations = stationsFor(train);
      list.innerHTML = stations.map((name, index) => {
        const pointClass = index === 0
          ? "stop-point origin"
          : index === stations.length - 1
            ? "stop-point destination"
            : "stop-point";
        return `<span class="${pointClass}"><span class="stop-node"></span><span class="stop-label">${name}</span></span>`;
      }).join("");
      list.classList.toggle("compact", stations.length > 7);
      list.classList.remove("english");
    }
