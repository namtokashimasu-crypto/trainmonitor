<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東武動物公園駅 リアルタイム発車案内ディスプレイ</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@700&family=Noto+Sans+JP:wght@700;900&display=swap');

    :root {
      --bg-board: #000000;
      --border-outer: #222222;
      --text-white: #ffffff;
      --text-yellow: #ffcc00;
      --text-orange: #ff9900;
      --text-gray: #aaaaaa;
      --badge-ltd: #d90429;     /* 特急・ライナー */
      --badge-express: #e6007e; /* 急行・区間急行 */
      --badge-semi: #009944;    /* 準急・区間準急 */
      --badge-local: #ffffff;   /* 普通 */
      --badge-end: #333333;
      --delay-red: #ff3333;
      --ok-green: #00ff66;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #0d0d0d;
      color: var(--text-white);
      font-family: 'Noto Sans JP', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .board-container {
      background-color: var(--bg-board);
      width: 100%;
      max-width: 1100px;
      border: 12px solid var(--border-outer);
      border-radius: 8px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9);
      padding: 20px;
      overflow: hidden;
      position: relative;
    }

    /* 上部ホーム案内 */
    .top-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #333;
      height: 50px;
      margin-bottom: 15px;
    }

    .banner-left { display: flex; align-items: center; }

    .platform-num {
      background: linear-gradient(135deg, #111, #333);
      color: #fff;
      font-size: 2rem;
      font-weight: 900;
      width: 55px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #fff;
      border-right: 6px solid #f60;
      margin-right: 15px;
      font-family: 'Chakra Petch', sans-serif;
      flex-shrink: 0;
    }

    .banner-text {
      font-size: 1.25rem;
      color: #ddd;
      font-weight: bold;
      line-height: 50px;
      height: 50px;
      display: flex;
      align-items: center;
    }

    .audio-btn {
      background: #222;
      color: #ffcc00;
      border: 1px solid #ffcc00;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .audio-btn.enabled {
      background: #00ff66;
      color: #000;
      border-color: #00ff66;
    }

    /* テーブルヘッダー */
    .board-header {
      display: grid;
      grid-template-columns: 220px 180px 1fr 140px;
      color: var(--text-gray);
      font-size: 0.95rem;
      border-bottom: 1px solid #444;
      height: 30px;
      line-height: 30px;
      text-align: center;
    }

    /* 発車行 */
    .board-row {
      display: grid;
      grid-template-columns: 220px 180px 1fr 140px;
      align-items: center;
      border-bottom: 1px solid #222;
      text-align: center;
      height: 85px;
    }

    .dept-time {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 3.5rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 85px;
    }

    .badge-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100%;
    }

    .train-badge {
      width: 140px;
      height: 42px;
      line-height: 42px;
      font-size: 1.3rem;
      font-weight: 900;
      border-radius: 4px;
      text-align: center;
    }

    .badge-ltd { background-color: var(--badge-ltd); color: #fff; }
    .badge-express { background-color: var(--badge-express); color: #fff; }
    .badge-semi { background-color: var(--badge-semi); color: #fff; }
    .badge-local { background-color: var(--badge-local); color: #000; }
    .badge-end { background-color: var(--badge-end); color: #aaa; }

    .destination {
      font-size: 2.2rem;
      font-weight: 900;
      color: var(--text-white);
      text-align: left;
      padding-left: 30px;
      line-height: 85px;
      white-space: nowrap;
    }

    .cars-info {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--text-white);
      line-height: 85px;
    }

    .cars-unit { font-size: 1.1rem; font-weight: normal; margin-left: 4px; }

    /* 運行状況テロップバー */
    .notice-bar {
      background-color: #111;
      color: var(--ok-green);
      border: 1px solid #333;
      height: 48px;
      margin: 15px 0;
      font-size: 1.2rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 下段マルチ接続カード（高視認性改修） */
    .info-section {
      background: #060b18;
      border: 2px solid #1c2d4a;
      border-radius: 8px;
      padding: 12px 18px;
      height: 185px;
    }

    .info-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      height: 32px;
      margin-bottom: 8px;
    }

    .info-title-box { display: flex; align-items: center; gap: 12px; }

    .route-badge {
      background: linear-gradient(135deg, #ff9900, #ff6600);
      color: #000;
      font-size: 0.8rem;
      font-weight: 900;
      padding: 4px 10px;
      border-radius: 4px;
      font-family: 'Chakra Petch', sans-serif;
    }

    .info-title-text { color: var(--text-orange); font-size: 1.25rem; font-weight: 900; }

    .info-countdown-box {
      background: #000;
      border: 1px solid #2a3a57;
      padding: 4px 14px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 1.25rem;
      color: var(--ok-green);
      font-weight: bold;
    }

    .info-connection-flow {
      display: grid;
      grid-template-columns: 1fr 28px 1.5fr 28px 1fr;
      align-items: center;
      gap: 6px;
      height: 115px;
    }

    .step-card {
      background: #111625;
      border: 1px solid #233555;
      border-radius: 6px;
      padding: 8px 6px;
      height: 115px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
    }

    .step-card.highlight { background: #0f1c33; border-color: #38bdf8; }

    .step-station-row { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; }
    .step-station-name { font-size: 1.05rem; color: #e2e8f0; font-weight: 900; }

    .platform-badge {
      background: #ffcc00;
      color: #000;
      font-size: 0.75rem;
      font-weight: 900;
      padding: 1px 6px;
      border-radius: 3px;
    }

    .step-time-main {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--text-yellow);
      line-height: 1.1;
    }

    .step-time-transfer {
      font-family: 'Chakra Petch', sans-serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text-orange);
      line-height: 1.1;
      white-space: nowrap;
    }

    .step-sub-label {
      font-size: 0.85rem;
      color: #94a3b8;
      font-weight: bold;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      width: 100%;
    }

    .arrow { color: var(--text-orange); font-size: 1.4rem; font-weight: bold; text-align: center; }
  </style>
</head>
<body>

  <div class="board-container" id="main-board">
    
    <!-- 1. 東武動物公園駅 上りホーム案内 -->
    <div class="top-banner">
      <div class="banner-left">
        <div class="platform-num">2</div>
        <div class="banner-text" id="top-banner-text">
          春日部・北千住・とうきょうスカイツリー・浅草・中目黒・渋谷・中央林間 方面
        </div>
      </div>
      <button class="audio-btn" id="audio-toggle-btn" onclick="toggleAudio()">🔊 音声: OFF (クリックで有効化)</button>
    </div>

    <!-- 2. 発車標テーブルヘッダー -->
    <div class="board-header">
      <div id="hdr-dept">発車時刻</div>
      <div id="hdr-train">種別</div>
      <div style="text-align: left; padding-left: 30px;" id="hdr-to">行先</div>
      <div id="hdr-cars">両数</div>
    </div>

    <!-- 先発 -->
    <div class="board-row">
      <div class="dept-time" id="m1-time">--:--</div>
      <div class="badge-container"><span class="train-badge badge-local" id="m1-badge">普通</span></div>
      <div class="destination" id="m1-dest">--</div>
      <div class="cars-info" id="m1-cars">--<span class="cars-unit" id="m1-unit">両</span></div>
    </div>

    <!-- 運行状況テロップ -->
    <div class="notice-bar" id="notice-text">
      【運行状況】東武スカイツリーライン・伊勢崎線：平常運転
    </div>

    <!-- 次発 -->
    <div class="board-row">
      <div class="dept-time" id="m2-time">--:--</div>
      <div class="badge-container"><span class="train-badge badge-local" id="m2-badge">普通</span></div>
      <div class="destination" id="m2-dest">--</div>
      <div class="cars-info" id="m2-cars">--<span class="cars-unit" id="m2-unit">両</span></div>
    </div>

    <!-- 次々発 -->
    <div class="board-row" style="border: none;">
      <div class="dept-time" id="m3-time">--:--</div>
      <div class="badge-container"><span class="train-badge badge-local" id="m3-badge">普通</span></div>
      <div class="destination" id="m3-dest">--</div>
      <div class="cars-info" id="m3-cars">--<span class="cars-unit" id="m3-unit">両</span></div>
    </div>

    <!-- 3. 白岡接続案内カード -->
    <div class="info-section">
      <div class="info-header">
        <div class="info-title-box">
          <span class="route-badge">TRANSFER INFO</span>
          <span class="info-title-text" id="info-card-title">久喜乗り換え ➔ JR宇都宮線 白岡行き接続</span>
        </div>
        <div class="info-countdown-box" id="info-countdown">
          あと --:--
        </div>
      </div>

      <div class="info-connection-flow">
        <!-- 東武動物公園発 -->
        <div class="step-card">
          <div class="step-station-row">
            <span class="step-station-name" id="st-origin">東武動物公園</span>
            <span class="platform-badge">4番線</span>
          </div>
          <div class="step-time-main" id="origin-dep-time">--:--</div>
          <div class="step-sub-label" id="lbl-origin-line">東武伊勢崎線</div>
        </div>

        <div class="arrow">➔</div>

        <!-- 久喜駅乗り換え -->
        <div class="step-card highlight">
          <div class="step-station-row">
            <span class="step-station-name" id="st-transfer">久喜駅 乗り換え</span>
            <span class="platform-badge">1・2番線</span>
          </div>
          <div class="step-time-transfer" id="transfer-time">--:-- / --:--</div>
          <div class="step-sub-label" id="lbl-transfer-info" style="color: #ffcc00;">JR宇都宮線</div>
        </div>

        <div class="arrow">➔</div>

        <!-- 白岡駅到着 -->
        <div class="step-card">
          <div class="step-station-row">
            <span class="step-station-name" id="st-dest">白岡駅 到着</span>
          </div>
          <div class="step-time-main" id="dest-arr-time" style="color: var(--ok-green);">--:--</div>
          <div class="step-sub-label" id="lbl-dest-arr">到着予定</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    let isEnglish = false;
    let audioEnabled = false;
    let audioCtx = null;
    let lastChimeTime = "";

    // チャイム鳴動
    function playChime() {
      if (!audioEnabled) return;
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc1 = audioCtx.createOscillator();
        const gain1 = audioCtx.createGain();
        osc1.type = 'sine';
        osc1.frequency.setValueAtTime(659.25, now);
        gain1.gain.setValueAtTime(0.3, now);
        gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.8);
        osc1.connect(gain1);
        gain1.connect(audioCtx.destination);
        osc1.start(now);
        osc1.stop(now + 0.8);

        const osc2 = audioCtx.createOscillator();
        const gain2 = audioCtx.createGain();
        osc2.type = 'sine';
        osc2.frequency.setValueAtTime(523.25, now + 0.35);
        gain2.gain.setValueAtTime(0.3, now + 0.35);
        gain2.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc2.connect(gain2);
        gain2.connect(audioCtx.destination);
        osc2.start(now + 0.35);
        osc2.stop(now + 1.2);
      } catch (e) { console.warn("Audio error:", e); }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById("audio-toggle-btn");
      if (audioEnabled) {
        btn.textContent = "🔊 音声: ON (予告チャイム有効)";
        btn.classList.add("enabled");
        playChime();
      } else {
        btn.textContent = "🔊 音声: OFF (クリックで有効化)";
        btn.classList.remove("enabled");
      }
    }

    document.body.addEventListener('click', () => {
      if (!audioEnabled) toggleAudio();
    }, { once: true });

    // 3秒ごとに日英切替
    setInterval(() => {
      isEnglish = !isEnglish;
      updateLanguageUI();
      updateMonitor();
    }, 3000);

    function updateLanguageUI() {
      document.getElementById("hdr-dept").textContent = isEnglish ? "Departure time" : "発車時刻";
      document.getElementById("hdr-train").textContent = isEnglish ? "Train" : "種別";
      document.getElementById("hdr-to").textContent = isEnglish ? "To" : "行先";
      document.getElementById("hdr-cars").textContent = isEnglish ? "Cars" : "両数";
      
      document.getElementById("m1-unit").textContent = isEnglish ? "Cars" : "両";
      document.getElementById("m2-unit").textContent = isEnglish ? "Cars" : "両";
      document.getElementById("m3-unit").textContent = isEnglish ? "Cars" : "両";

      document.getElementById("top-banner-text").textContent = isEnglish 
        ? "for Kasukabe, Kita-senju, TOKYO SKYTREE, Asakusa, Naka-meguro, Shibuya, Chuo-rinkan"
        : "春日部・北千住・とうきょうスカイツリー・浅草・中目黒・渋谷・中央林間 方面";

      document.getElementById("info-card-title").textContent = isEnglish
        ? "Transfer at Kuki ➔ JR Utsunomiya Line for Shiraoka"
        : "久喜乗り換え ➔ JR宇都宮線 白岡行き接続";

      document.getElementById("st-origin").textContent = isEnglish ? "Tobu-doubutsukoen" : "東武動物公園";
      document.getElementById("lbl-origin-line").textContent = isEnglish ? "Tobu Isesaki Line" : "東武伊勢崎線";

      document.getElementById("st-transfer").textContent = isEnglish ? "Kuki Sta." : "久喜駅 乗り換え";
      document.getElementById("st-dest").textContent = isEnglish ? "Shiraoka Sta." : "白岡駅 到着";
      document.getElementById("lbl-dest-arr").textContent = isEnglish ? "Est. Arrival" : "到着予定";
    }

    // CSV解析から組み込んだ全データ参照関数
    function getTodayDatasets() {
      const day = new Date().getDay();
      const isWeekend = (day === 0 || day === 6);
      return {
        upTrains: isWeekend ? holidayUpTrains : weekdayUpTrains,
        connections: isWeekend ? holidayConnections : weekdayConnections
      };
    }

    function timeToMinutes(timeStr) {
      if (!timeStr || timeStr === "---") return 9999;
      const [h, m] = timeStr.split(":").map(Number);
      let mins = h * 60 + m;
      if (h < 4) mins += 1440; // 深夜24:11対応
      return mins;
    }

    function updateMonitor() {
      const now = new Date();
      let nowH = now.getHours();
      let nowM = now.getMinutes();
      let currentMin = nowH * 60 + nowM;
      if (nowH < 4) currentMin += 1440;
      const currentSec = now.getSeconds();

      const { upTrains, connections } = getTodayDatasets();

      // 1. 上部発車標更新
      const upcomingUp = upTrains.filter(r => {
        const trainMin = timeToMinutes(r.time);
        return trainMin > currentMin || (trainMin === currentMin && currentSec === 0);
      });

      if (upcomingUp.length === 0) {
        document.getElementById("notice-text").textContent = isEnglish 
          ? "【Notice】 End of today's train service."
          : "【案内】本日の電車は終了いたしました。";
        setRowDataFinished("m1"); setRowDataFinished("m2"); setRowDataFinished("m3");
      } else {
        document.getElementById("notice-text").textContent = isEnglish
          ? "【Status】 Tobu Skytree Line / Isesaki Line: Normal Operation"
          : "【運行状況】東武スカイツリーライン・伊勢崎線：平常運転";

        setRowData("m1", upcomingUp[0]);
        setRowData("m2", upcomingUp[1]);
        setRowData("m3", upcomingUp[2]);

        // 10秒前チャイム判定
        const nextTrain = upcomingUp[0];
        const trainMin = timeToMinutes(nextTrain.time);
        const diffSec = (trainMin * 60) - (currentMin * 60 + currentSec);

        if (diffSec === 10 && lastChimeTime !== nextTrain.time) {
          playChime();
          lastChimeTime = nextTrain.time;
        }
      }

      // 2. 下段白岡接続カード更新
      const countdownEl = document.getElementById("info-countdown");
      const nextConn = connections.find(r => {
        const trainMin = timeToMinutes(r.tobuDep);
        return trainMin > currentMin || (trainMin === currentMin && currentSec === 0);
      });

      if (nextConn) {
        document.getElementById("origin-dep-time").textContent = nextConn.tobuDep;
        document.getElementById("transfer-time").textContent = `${nextConn.kukiArr} / ${nextConn.jrDep}`;
        
        let labelText = "JR宇都宮線";
        if (nextConn.jrType && nextConn.jrDest) {
          labelText = `${nextConn.jrType} (${nextConn.jrDest}行)`;
        } else if (nextConn.shiraokaArr === "当日接続なし") {
          labelText = "当日接続なし";
        }
        document.getElementById("lbl-transfer-info").textContent = labelText;
        document.getElementById("dest-arr-time").textContent = nextConn.shiraokaArr;

        const trainMin = timeToMinutes(nextConn.tobuDep);
        const diffSec = (trainMin * 60) - (currentMin * 60 + currentSec);
        countdownEl.textContent = `${isEnglish ? "In " : "あと "}${String(Math.floor(diffSec/60)).padStart(2,'0')}:${String(diffSec%60).padStart(2,'0')}`;
      } else {
        document.getElementById("origin-dep-time").textContent = "--:--";
        document.getElementById("transfer-time").textContent = "--:-- / --:--";
        document.getElementById("lbl-transfer-info").textContent = "---";
        document.getElementById("dest-arr-time").textContent = "--:--";
        countdownEl.textContent = isEnglish ? "Finished" : "本日の接続終了";
      }
    }

    function setRowData(prefix, data) {
      if (data) {
        document.getElementById(`${prefix}-time`).textContent = data.time;
        document.getElementById(`${prefix}-dest`).textContent = isEnglish ? data.destEn : data.destJa;
        document.getElementById(`${prefix}-cars`).innerHTML = `${data.cars}<span class="cars-unit">${isEnglish ? 'Cars' : '両'}</span>`;
        document.getElementById(`${prefix}-badge`).textContent = isEnglish ? data.typeEn : data.typeJa;
        document.getElementById(`${prefix}-badge`).className = `train-badge ${data.badge}`;
      } else {
        setRowDataFinished(prefix);
      }
    }

    function setRowDataFinished(prefix) {
      document.getElementById(`${prefix}-time`).textContent = "--:--";
      document.getElementById(`${prefix}-dest`).textContent = isEnglish ? "End of today's service" : "本日の運転は終了いたしました";
      document.getElementById(`${prefix}-cars`).innerHTML = `--<span class="cars-unit">${isEnglish ? 'Cars' : '両'}</span>`;
      document.getElementById(`${prefix}-badge`).textContent = isEnglish ? "End" : "終了";
      document.getElementById(`${prefix}-badge`).className = "train-badge badge-end";
    }

    // ★ CSVから抽出された完全リアルマスターデータ（省略なし） ★
    const weekdayUpTrains = [
      { time: "05:09", typeJa: "準急", typeEn: "Semi Exp.", badge: "badge-semi", destJa: "長津田", destEn: "Nagatsuta", cars: "10" },
      { time: "05:19", typeJa: "準急", typeEn: "Semi Exp.", badge: "badge-semi", destJa: "中央林間", destEn: "Chuo-rinkan", cars: "10" },
      { time: "05:29", typeJa: "普通", typeEn: "Local", badge: "badge-local", destJa: "中目黒", destEn: "Naka-meguro", cars: "7" },
      { time: "05:35", typeJa: "区間急行", typeEn: "Section Exp.", badge: "badge-express", destJa: "浅草", destEn: "Asakusa", cars: "6" },
      { time: "05:37", typeJa: "準急", typeEn: "Semi Exp.", badge: "badge-semi", destJa: "中央林間", destEn: "Chuo-rinkan", cars: "10" },
